<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunaro Films | Pre-Wedding Cinema</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <link rel="icon" type="image/x-icon" href="assets/img/Tab/Logo.png">

    <style>
        :root {
            --gold: #c5a059;
            --dark: #0a0a0a;
            --light: #f9f7f2;
            --shadow: rgba(0, 0, 0, 0.15);
        }

        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--light);
            overflow-x: hidden;
            color: var(--dark);
        }

        /* --- BACK BUTTON --- */
        .back-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--gold);
            padding: 10px 25px;
            border-radius: 50px;
            text-decoration: none;
            color: var(--gold);
            font-size: 12px;
            font-weight: bold;
            transition: 0.4s;
            display: inline-block;
        }

        .back-btn:hover {
            background: var(--gold);
            color: #fff;
            transform: translateX(-5px);
        }

        /* --- BOOK NOW BUTTON --- */
        .book-now-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--gold);
            color: #fff;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            z-index: 999;
            box-shadow: 0 10px 20px rgba(184, 154, 103, 0.3);
            transition: 0.3s;
        }

        .book-now-btn:hover {
            transform: scale(1.05);
            background: var(--dark);
        }

        /* --- HERO & 3D TITLE --- */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            overflow: hidden;
        }

        .hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            will-change: transform;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%) scale(1.05);
            filter: brightness(0.5) contrast(1.1);
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.2),
                rgba(0,0,0,0.7)
            );
            z-index: 0;
        }

        .hero-content {
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3.5rem, 10vw, 7rem);
            color: var(--dark);
            text-transform: uppercase;
            margin: 0;
            color: white;
            line-height: 1;
            text-shadow:
                1px 1px 0px #333,
                2px 2px 0px #222,
                3px 3px 0px #111,
                10px 10px 20px rgba(0,0,0,0.5);
            transform: translateZ(60px);
        }

        .hero p {
            color: var(--gold);
            letter-spacing: 8px;
            font-weight: 200;
            margin-top: 10px;
            text-transform: uppercase;
            transform: translateZ(30px);
        }

        /* GALLERY */
        .gallery {
            padding: 100px 5%;
            background-color: var(--light);
        }

        .masonry {
            column-count: 4;
            column-gap: 15px;
        }

        .photo-item {
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background: #e0e0e0;
            transition: transform 0.4s ease;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .photo-item img {
            width: 100%;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            filter: brightness(0.95) contrast(1.05);
        }

        .photo-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.4));
            z-index: 1;
            opacity: 0;
            transition: 0.4s;
        }

        .photo-item:hover::before {
            opacity: 1;
        }

        .photo-item:hover img {
            transform: scale(1.08);
        }

        .photo-item::after {
            content: "LUNARO FILMS";
            position: absolute;
            bottom: 15px;
            right: 15px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 10px;
            letter-spacing: 2px;
            z-index: 2;
            font-weight: 600;
            opacity: 0;
            transition: 0.4s;
        }

        .photo-item:hover::after {
            opacity: 1;
        }

        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #lightbox button {
            display: none;
        }

        #prevBtn {
            left: 30px;
        }

        #nextBtn {
            right: 30px;
        }

        #lightImg {
            max-width: 90%;
            max-height: 80vh;
            border: 2px solid var(--gold);
            transition: 0.4s;
        }

        @media (max-width:1024px) {
            .masonry {
                column-count: 3;
            }
        }

        @media (max-width:768px) {
            .masonry {
                column-count: 2;
            }
        }

        @media (max-width:480px) {
            .masonry {
                column-count: 1;
            }
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
            gap: 25px;
            padding: 50px 5%;
        }

        .video-card {
            background: #000;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .video-thumb img {
            width: 100%;
            opacity: 0.7;
            transition: 0.5s;
        }

        .video-card:hover .video-thumb img {
            opacity: 0.4;
            transform: scale(1.05);
        }

        .video-thumb i {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 40px;
            z-index: 2;
        }

        footer {
            background: #000;
            color: #fff;
            padding: 60px 5%;
            text-align: center;
        }

        .footer-logo {
            font-family: 'Playfair Display';
            color: var(--gold);
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .footer-socials {
            margin: 20px 0;
        }

        .footer-socials i {
            margin: 0 15px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .footer-socials i:hover {
            color: var(--gold);
        }
    </style>
</head>

<body>

<nav class="back-nav">
    <a href="javascript:history.back()" class="back-btn">
        <i class="fas fa-arrow-left"></i> BACK
    </a>
</nav>

<a href="Book/book.html" class="book-now-btn">BOOK NOW</a>

<section class="hero" id="hero">
    <video autoplay loop playsinline preload="auto">
        <source src="assets/Video/Pre-Wedding/Back.mp4">
    </video>

    <div class="hero-content" id="tiltContent">
        <h1>Lunaro Films</h1>
        <p>Pre-Wedding Cinema</p>
    </div>
</section>

<section class="gallery">
    <h2 style="text-align:center; color:var(--dark); font-family:'Playfair Display'; margin-bottom:40px; font-size: 2.5rem;">
        Visual Stories
    </h2>
    <div class="masonry" id="gallery"></div>
</section>

<section style="background:var(--dark); color: #fff;">
    <h2 style="text-align:center; color:var(--gold); padding-top:60px; font-family:'Playfair Display'; font-size: 2.5rem;">
        Cinematic Reels
    </h2>
    <div class="video-grid" id="videos"></div>
</section>

<div id="lightbox">
    <button id="prevBtn">❮</button>
    <img id="lightImg">
    <button id="nextBtn">❯</button>
</div>

<footer>
    <div class="footer-logo">Lunaro Films</div>
    <p>We capture the soul of your most precious moments.</p>

    <div class="footer-socials">
        <a href="https://www.instagram.com/lunarofilms?igsh=MXI1eGE0OXZubGg5bw==">
            <i class="fab fa-instagram"></i>
        </a>
    </div>

    <p style="font-size: 12px; opacity: 0.5;">
        &copy; 2024 Lunaro Films. All Rights Reserved.
    </p>
</footer>

<script>
// 2. GALLERY
const gallery = document.getElementById("gallery");

const images = [
    "assets/img/Pre-Wedding/001.jpg",
    "assets/img/Pre-Wedding/002.jpg",
    "assets/img/Pre-Wedding/003.jpg",
    "assets/img/Pre-Wedding/004.jpg",
    "assets/img/Pre-Wedding/005.jpg",
    "assets/img/Pre-Wedding/006.jpg",
    "assets/img/Pre-Wedding/007.jpg",
    "assets/img/Pre-Wedding/008.jpg",
    "assets/img/Pre-Wedding/009.jpg",
    "assets/img/Pre-Wedding/010.jpg",
    "assets/img/Pre-Wedding/011.jpg",
    "assets/img/Pre-Wedding/012.jpg",
    "assets/img/Pre-Wedding/013.jpg",
    "assets/img/Pre-Wedding/014.jpg",
    "assets/img/Pre-Wedding/015.jpg",
    "assets/img/Pre-Wedding/016.jpg",
    "assets/img/Pre-Wedding/017.jpg",
    "assets/img/Pre-Wedding/018.jpg",
    "assets/img/Pre-Wedding/019.jpg",
    "assets/img/Pre-Wedding/020.jpg",
    "assets/img/Pre-Wedding/021.jpg",
    "assets/img/Pre-Wedding/022.jpg",
    "assets/img/Pre-Wedding/023.jpg",
    "assets/img/Pre-Wedding/024.jpg",
    "assets/img/Pre-Wedding/025.jpg",
    "assets/img/Pre-Wedding/026.jpg",
    "assets/img/Pre-Wedding/027.jpg",
    "assets/img/Pre-Wedding/028.jpg",
    "assets/img/Pre-Wedding/029.jpg",
    "assets/img/Pre-Wedding/030.jpg",
    "assets/img/Pre-Wedding/031.jpg",
];

// 🔥 NEW VARIABLES
let currentIndex = 0;
const lightbox = document.getElementById("lightbox");
const lightImg = document.getElementById("lightImg");
const sideVideo = document.getElementById("sideVideo");

// OPEN IMAGE
function openImage(index) {
    currentIndex = index;
    lightImg.src = images[index];
    lightbox.style.display = "flex";
}

// CLOSE IMAGE
lightbox.onclick = (e) => {
    if (e.target.id !== "prevBtn" && e.target.id !== "nextBtn") {
        lightbox.style.display = "none";
    }
};

// CHANGE IMAGE
function changeImage(step) {
    currentIndex += step;

    if (currentIndex < 0) currentIndex = images.length - 1;
    if (currentIndex >= images.length) currentIndex = 0;

    lightImg.style.opacity = 0;

    setTimeout(() => {
        lightImg.src = images[currentIndex];
        lightImg.style.opacity = 1;
    }, 200);
}

// BUTTON EVENTS
document.getElementById("prevBtn").onclick = (e) => {
    e.stopPropagation();
    changeImage(-1);
};

document.getElementById("nextBtn").onclick = (e) => {
    e.stopPropagation();
    changeImage(1);
};

// GALLERY RENDER
images.forEach((imgUrl, index) => {
    let div = document.createElement("div");
    div.className = "photo-item";

    let img = document.createElement("img");
    img.src = imgUrl;
    img.loading = "lazy";
    img.draggable = false;

    img.onclick = (e) => e.preventDefault();

    div.appendChild(img);

    div.onclick = () => openImage(index);

    gallery.appendChild(div);
});

// 3. VIDEOS
const vids = [
    {
        link: "https://youtu.be/7mOO5iCSNj4?si=EhOoXF_h0Xrp46TR",
        thumb: "assets/img/Pre-Wedding/Thumbnail/1.jpg"
    },
    {
        link: "https://youtu.be/MkNtgoPr-TE?si=6Tzsth41qUGC_ZeI",
        thumb: "assets/img/Pre-Wedding/Thumbnail/2.jpg"
    },
    {
        link: "https://youtu.be/gImV2_WNseY?si=iGn6_KKr3nQbx2yv",
        thumb: "assets/img/Pre-Wedding/Thumbnail/3.jpg"
    }
];

const videoDiv = document.getElementById("videos");

vids.forEach(v => {
    let card = document.createElement("div");
    card.className = "video-card";

    card.onclick = () => window.location.href = v.link;

    card.innerHTML = `
        <div class="video-thumb">
            <img src="${v.thumb}" draggable="false">
            <i class="fas fa-play-circle"></i>
        </div>
    `;

    videoDiv.appendChild(card);
});
document.addEventListener("keydown", (e) => {
    if (lightbox.style.display === "flex") {
        if (e.key === "ArrowRight") {
            changeImage(1);
        }
        if (e.key === "ArrowLeft") {
            changeImage(-1);
        }
        if (e.key === "Escape") {
            lightbox.style.display = "none";
        }
    }
});

let startX = 0;

lightbox.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend", (e) => {
    let endX = e.changedTouches[0].clientX;
    let diff = startX - endX;

    if (Math.abs(diff) > 50) {
        if (diff > 0) {
            changeImage(1); // swipe left → next
        } else {
            changeImage(-1); // swipe right → prev
        }
    }
});
 // --- DISABLE RIGHT CLICK ---
    document.addEventListener("contextmenu", e => e.preventDefault());


    // --- DISABLE DRAG ---
    document.addEventListener("dragstart", e => e.preventDefault());


    // --- DISABLE DEV TOOLS ---
    document.addEventListener("keydown", function (e) {
        if (e.key === "F12") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key === "I") e.preventDefault();
        if (e.ctrlKey && e.key === "U") e.preventDefault();
    });


    // --- BLUR WHEN INSPECT OPEN ---
    setInterval(() => {
        if (window.outerWidth - window.innerWidth > 100) {
            document.body.style.filter = "blur(15px)";
        } else {
            document.body.style.filter = "none";
        }
    }, 500);


    // --- SCREENSHOT TRICK ---
    document.addEventListener("keydown", function (e) {
        if (e.key === "PrintScreen") {
            document.body.style.background = "black";
            setTimeout(() => document.body.style.background = "", 100);
        }
    });
</script>

</body>
</html>
