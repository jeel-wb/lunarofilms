<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunaro Films | Cinematic Weddings</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
<link rel="icon" type="image/x-icon" href="assets/img/Tab/Logo.png">
<style>
:root {
    --gold: #c5a059; 
    --dark: #1a1a1a;
    --light: #fdfaf5;
    --shadow: rgba(0, 0, 0, 0.1);
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}
html { scroll-behavior: smooth; }
body{font-family:'Montserrat',sans-serif;background:var(--light);overflow-x:hidden; color: var(--dark);}

/* NAVIGATION */
.back-nav{position:fixed;top:20px;left:20px;z-index:999;}
.back-btn{
    background:rgba(255, 255, 255, 0.9);
    border:1px solid var(--gold);
    padding:10px 25px;
    border-radius:50px;
    text-decoration:none;
    color:var(--gold);
    font-size:12px;
    font-weight: bold;
    transition: 0.4s;
    display: inline-block;
}
.back-btn:hover { background: var(--gold); color: #fff; transform: translateX(-5px); }

.book-now-btn{
    position:fixed;
    top:20px;
    right:20px;
    background:var(--gold);
    color:#fff;
    padding:12px 30px;
    border-radius:50px;
    text-decoration:none;
    font-weight: 600;
    z-index: 999;
    box-shadow: 0 10px 20px rgba(184, 154, 103, 0.3);
    transition: 0.3s;
}
.book-now-btn:hover { transform: scale(1.05); background: var(--dark); }

/* MUSIC PLAYER */
.music-vinyl-container{
    position:fixed;
    bottom:20px;
    left:20px;
    display:flex;
    gap:15px;
    align-items:center;
    z-index:999;
    background: rgba(255,255,255,0.9);
    padding: 8px 15px;
    border-radius: 50px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    border: 1px solid var(--gold);
    cursor: pointer;
}
.vinyl-record{
    width:40px; height:40px;
    border-radius:50%;
    background: radial-gradient(circle, #333 20%, #000 100%);
    border: 2px solid #222;
    animation:spin 3s linear infinite;
    position: relative;
}
.vinyl-record::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 8px; height: 8px; background: var(--gold); border-radius: 50%;
}
@keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

/* HERO */
.hero{
    height:100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
    overflow: hidden;
}
.hero video {
    position: absolute;
    top: 50%;
    left: 50%;

    width: 100%;
    height: 100%;

    object-fit: cover; /* 🔥 main fix */
    transform: translate(-50%, -50%) scale(1.05);

    filter: brightness(0.5) blur(3px) contrast(1.1);
}
.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.7)
    );
    z-index: 0;
}
.hero-content {
    text-align: center;
    transform-style: preserve-3d;
    z-index: 5;
}
.hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 10vw, 7rem);
    color: #fff;
    text-transform: uppercase;
    line-height: 1;
    text-shadow: 5px 5px 15px rgba(0,0,0,0.4);
}
.hero p {
    color: var(--gold);
    letter-spacing: 8px;
    font-weight: 200;
    margin-top: 10px;
    text-transform: uppercase;
}

/* GALLERY */
.gallery { padding: 100px 5%; background-color: var(--light); }
.masonry { column-count: 4; column-gap: 15px; }
.photo-item {
    margin-bottom: 15px;
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    transition: transform 0.4s ease;
}
.photo-item img {
    width: 100%; display: block;
    transition: 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}
.photo-item:hover img { transform: scale(1.08); }
.photo-item::after {
    content: "LUNARO WEDDINGS";
    position: absolute; bottom: 15px; right: 15px;
    color: rgba(255, 255, 255, 0.8); font-size: 10px;
    letter-spacing: 2px; opacity: 0; transition: 0.4s;
}
.photo-item:hover::after { opacity: 1; }

/* VIDEO GRID */
/* IMPROVED VIDEO SECTION */
.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); /* Larger minimum width for cinematic feel */
    gap: 30px;
    padding: 80px 5%;
    background: #000;
}

.video-card {
    position: relative;
    background: #111;
    overflow: hidden;
    border-radius: 12px; /* Slightly rounded for premium look */
    cursor: pointer;
    aspect-ratio: 16 / 9; /* 🔥 Forces all thumbnails to be the same cinematic size */
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: transform 0.5s cubic-bezier(0.2, 1, 0.3, 1);
}

.video-card:hover {
    transform: translateY(-10px);
}

.video-thumb {
    width: 100%;
    height: 100%;
}

.video-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* 🔥 Ensures image fills the 16:9 area without stretching */
    opacity: 0.6;
    transition: 0.8s scale, 0.5s opacity;
}

.video-card:hover .video-thumb img {
    opacity: 0.3;
    scale: 1.1; /* Slow zoom effect */
}

.video-thumb i {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 50px;
    z-index: 2;
    opacity: 0.8;
    transition: 0.3s;
    text-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
}

.video-card:hover i {
    opacity: 1;
    scale: 1.2;
    color: var(--gold);
}

/* Watermark for Videos */
.video-card::after {
    content: "WATCH FILM";
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: #fff;
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(10px);
    transition: 0.4s;
}

.video-card:hover::after {
    opacity: 1;
    transform: translateY(0);
}

/* FOOTER */
footer { background: #000; color: #fff; padding: 60px 5%; text-align: center; }
.footer-logo { font-family: 'Playfair Display'; color: var(--gold); font-size: 2rem; margin-bottom: 20px; }
.footer-socials { margin: 20px 0; }
.footer-socials i { margin: 0 15px; font-size: 20px; cursor: pointer; transition: 0.3s; }
.footer-socials i:hover { color: var(--gold); }

@media(max-width:768px){ .masonry{column-count:2;} .hero h1 { font-size: 3.5rem; } }
</style>
</head>
<body>

<nav class="back-nav">
    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> BACK</a>
</nav>

<a href="Book/book.html" class="book-now-btn">BOOK YOUR STORY</a>

<div class="music-vinyl-container" id="musicToggle">
    <div class="vinyl-record" id="record"></div>
    <div>
        <i id="playIcon" class="fas fa-pause" style="color: var(--gold);"></i>
        <span id="statusText" style="font-size: 10px; font-weight: bold; color: var(--gold); margin-left: 5px;">PLAYING</span>
    </div>
    <audio id="bgMusic" loop autoplay muted>
        <source src="assets/Music/Wedding/Back.mp3" type="audio/mpeg">
    </audio>
</div>

<section class="hero">
    <video autoplay  loop playsinline>
        <source src="assets/Video/Wedding/Groom Teaser.mp4" type="video/mp4">
    </video>
    <div class="hero-content">
        <h1>Eternal Love</h1>
        <p>Wedding Cinema</p>
    </div>
</section>

<section class="gallery">
    <h2 style="text-align:center; color:var(--dark); font-family:'Playfair Display'; margin-bottom:40px; font-size: 2.5rem;">The Gallery</h2>
    <div class="masonry" id="gallery"></div>
</section>

<section style="background:var(--dark); color: #fff;">
    <h2 style="text-align:center; color:var(--gold); padding-top:60px; font-family:'Playfair Display'; font-size: 2.5rem;">Cinematic Films</h2>
    <div class="video-grid" id="videos"></div>
</section>

<footer>
    <div class="footer-logo">Lunaro Films</div>
    <p>We capture the soul of your most precious moments.</p>
    <div class="footer-socials">
        <a href="https://www.instagram.com/lunarofilms?igsh=MXI1eGE0OXZubGg5bw=="><i class="fab fa-instagram"></i></a>
    </div>
    <p style="font-size: 12px; opacity: 0.5;">&copy; 2025 Lunaro Films. All Rights Reserved.</p>
</footer>

<div id="lightbox" style="position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none; justify-content:center; align-items:center; z-index:1000;" onclick="this.style.display='none'">
    <img id="lightImg" style="max-width:90%; max-height:80vh; border: 2px solid var(--gold);">
</div>

<script>
// 🔒 SECURITY SYSTEM

// Disable Right Click
document.addEventListener("contextmenu", e => e.preventDefault());

// Disable Drag
document.addEventListener("dragstart", e => e.preventDefault());

// Disable Dev Tools
document.addEventListener("keydown", function(e) {
    if (e.key === "F12") e.preventDefault();
    if (e.ctrlKey && e.shiftKey && e.key === "I") e.preventDefault();
    if (e.ctrlKey && e.key === "U") e.preventDefault();
});

// Blur when inspect open
setInterval(() => {
    if (window.outerWidth - window.innerWidth > 100) {
        document.body.style.filter = "blur(15px)";
    } else {
        document.body.style.filter = "none";
    }
}, 500);

// Screenshot trick
document.addEventListener("keydown", function(e) {
    if (e.key === "PrintScreen") {
        document.body.style.background = "black";
        setTimeout(() => document.body.style.background = "", 100);
    }
});


// 1. MUSIC CONTROL
const music = document.getElementById("bgMusic");
const record = document.getElementById("record");
const playIcon = document.getElementById("playIcon");
const statusText = document.getElementById("statusText");

// 🔥 Restore Time + State on Load
window.addEventListener("load", () => {
    const savedTime = localStorage.getItem("musicTime");
    const savedState = localStorage.getItem("musicState");

    if (savedTime) {
        music.currentTime = parseFloat(savedTime);
    }

    if (savedState === "paused") {
        music.pause();
        record.style.animationPlayState = 'paused';
        playIcon.classList.replace("fa-pause", "fa-play");
        statusText.innerText = "PAUSED";
    } else {
        // default = playing
        music.play().catch(() => {});
        record.style.animationPlayState = 'running';
        playIcon.classList.replace("fa-play", "fa-pause");
        statusText.innerText = "PLAYING";
    }
});

// 🔥 First Click Fix (Autoplay policy)
window.addEventListener('click', () => {
    if (music.paused && statusText.innerText === "PLAYING") {
        music.play().catch(() => {});
        record.style.animationPlayState = 'running';
    }
}, { once: true });

// 🔥 Save current time continuously
music.addEventListener("timeupdate", () => {
    localStorage.setItem("musicTime", music.currentTime);
});

// 🔥 Toggle Play/Pause + Save State
document.getElementById("musicToggle").onclick = (e) => {
    e.stopPropagation();

    if (music.paused) {
        music.play();
        record.style.animationPlayState = 'running';
        playIcon.classList.replace("fa-play", "fa-pause");
        statusText.innerText = "PLAYING";
        localStorage.setItem("musicState", "playing");
    } else {
        music.pause();
        record.style.animationPlayState = 'paused';
        playIcon.classList.replace("fa-pause", "fa-play");
        statusText.innerText = "PAUSED";
        localStorage.setItem("musicState", "paused");
    }
};

// GALLERY POPULATOR
const gallery = document.getElementById("gallery");
const weddingImages = [
    "assets/img/Wedding/1 (1).jpg", 
    "assets/img/Wedding/1 (1).webp", 
    "assets/img/Wedding/1 (2).jpg", 
    "assets/img/Wedding/1 (2).webp", 
    "assets/img/Wedding/1 (3).jpg", 
    "assets/img/Wedding/1 (3).webp", 
    "assets/img/Wedding/1 (4).jpg", 
    "assets/img/Wedding/1 (2).jpg"];
weddingImages.forEach(src => {
    let div = document.createElement("div");
    div.className = "photo-item";
    div.innerHTML = `<img src="${src}" draggable="false">`;
    div.onclick = () => {
        document.getElementById("lightImg").src = src;
        document.getElementById("lightbox").style.display = "flex";
    };
    gallery.appendChild(div);
});

// VIDEO POPULATOR
const vids = [
    {
        link: "https://youtu.be/-bYAMk91Lzc?si=tSG5mrnRoapypO8q",
        thumb: "assets/img/Wedding/Thumbnail/1.jpg"
    },
    {
        link: "https://youtu.be/tyBJioe8gOs?si=f7bIDzCWJ4lRWQTN",
        thumb: "assets/img/Wedding/Thumbnail/2.jpg"
    },
    {
        link: "https://youtu.be/OYQzr1VV5Eg?si=eE4sJ_2hVpPykf5a",
        thumb: "assets/img/Wedding/Thumbnail/3.jpg"
    }   
];

const videoDiv = document.getElementById("videos");

vids.forEach(v => {
    let card = document.createElement("div");
    card.className = "video-card";

    // 👉 open in SAME tab
    card.onclick = () => window.location.href = v.link;

    card.innerHTML = `
        <div class="video-thumb">
            <img src="${v.thumb}" draggable="false">
            <i class="fas fa-play-circle"></i>
        </div>
    `;

    videoDiv.appendChild(card);
});
</script>
</body>
</html>
