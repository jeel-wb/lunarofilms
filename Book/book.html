<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Online - Lunaro Films</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
<link rel="icon" type="image/x-icon" href="assets/img/Tab/Logo.png">
<style>
/* --- CSS VARIABLES --- */
:root {
    --primary-font: 'Playfair Display', serif;
    --secondary-font: 'Raleway', sans-serif;
    --accent-color: #d2b48c;
    --luxury-gold: #a3895d;
}

/* --- GLOBAL RESET --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* --- BODY --- */
body {
    font-family: var(--secondary-font);
    color: #333;
    min-height: 100vh;
    overflow-x: hidden;
    background: radial-gradient(circle at top, #ffffff, #f2eee3);
}

/* --- BACKGROUND ANIMATION --- */
.bokeh-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
}

.bokeh-item {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(210, 180, 140, 0.2) 0%, rgba(255, 255, 255, 0) 70%);
    border-radius: 50%;
    filter: blur(50px);
    animation: float 20s infinite ease-in-out;
}

.bokeh-item:nth-child(1) {
    top: 10%;
    left: 10%;
}

.bokeh-item:nth-child(2) {
    top: 60%;
    left: 80%;
    width: 400px;
    height: 400px;
    animation-delay: -5s;
}

.bokeh-item:nth-child(3) {
    top: 40%;
    left: 30%;
    width: 250px;
    height: 250px;
    animation-delay: -10s;
}

.bokeh-item:nth-child(4) {
    top: 80%;
    left: 10%;
    width: 350px;
    height: 350px;
    animation-delay: -15s;
}

@keyframes float {
    0%, 100% {
        transform: translate(0, 0) scale(1);
    }
    33% {
        transform: translate(50px, 30px) scale(1.1);
    }
    66% {
        transform: translate(-30px, 50px) scale(0.9);
    }
}

/* --- LUXURY BACK BUTTON --- */
.lux-back-btn {
    position: fixed;
    top: 30px;
    left: 30px;
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    z-index: 1000;
}

.btn-circle {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2c2c2c;
    font-size: 1.1rem;
    transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
}

.btn-text {
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 0.7rem;
    color: #2c2c2c;
    opacity: 0.7;
}

.lux-back-btn:hover .btn-circle {
    background: var(--luxury-gold);
    color: #fff;
    transform: scale(1.1) rotate(-10deg);
}

/* --- MAIN CONTENT --- */
.main-wrapper {
    padding: 120px 15px 60px;
    max-width: 950px;
    margin: 0 auto;
}

.page-header {
    text-align: center;
    margin-bottom: 50px;
}

.page-header h1 {
    font-family: var(--primary-font);
    font-size: clamp(2rem, 8vw, 3.2rem);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #2c2c2c;
    margin-bottom: 10px;
}

.page-header p {
    font-size: clamp(0.8rem, 2vw, 1rem);
    color: #888;
    max-width: 500px;
    margin: 0 auto;
}

.divider {
    width: 60px;
    height: 2px;
    background: var(--luxury-gold);
    margin: 25px auto;
}

/* --- 3D FORM CARD --- */
.form-card-3d {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(20px);
    padding: clamp(25px, 5vw, 50px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
    transition: transform 0.4s ease;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.input-box {
    margin-bottom: 25px;
}

.input-box label {
    display: block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    color: var(--luxury-gold);
}

.input-box input,
.input-box select,
.input-box textarea {
    width: 100%;
    padding: 16px;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    font-family: var(--secondary-font);
    font-size: 1rem;
    color: #333;
    transition: all 0.3s ease;
}

/* --- PLACEHOLDER --- */
::placeholder {
    color: #aaa;
    font-weight: 300;
}

.input-box input:focus,
.input-box select:focus,
.input-box textarea:focus {
    border-color: var(--luxury-gold);
    background: #fff;
    outline: none;
    box-shadow: 0 0 0 4px rgba(163, 137, 93, 0.1);
    transform: translateY(-2px);
}

/* --- DATE & TIME INPUT --- */
input[type="date"],
input[type="time"] {
    position: relative;
    cursor: pointer;
}

/* --- SUBMIT BUTTON --- */
.lux-submit-btn {
    width: 100%;
    padding: 22px;
    background: linear-gradient(135deg, #2d2d2d, #000);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    transition: all 0.4s ease;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    margin-top: 10px;
}

.lux-submit-btn:hover {
    background: linear-gradient(135deg, #a3895d, #d2b48c);
    transform: translateY(-4px);
    box-shadow: 0 15px 30px rgba(163, 137, 93, 0.3);
}

.lux-submit-btn i {
    font-size: 1.4rem;
}

/* =========================
   RESPONSIVE MEDIA QUERIES
========================= */

/* 🔵 Extra Large Screens */
@media (min-width: 1400px) {
    .main-wrapper {
        max-width: 1200px;
    }
}

/* 🟢 Laptop */
@media (max-width: 1200px) {
    .main-wrapper {
        max-width: 95%;
    }
}

/* 🟡 Tablet */
@media (max-width: 992px) {
    .main-wrapper {
        padding: 100px 20px;
    }

    .form-card-3d {
        padding: 35px;
    }

    .form-row {
        gap: 20px;
    }
}

/* 🟠 Small Tablet */
@media (max-width: 768px) {
    .form-row {
        grid-template-columns: 1fr;
    }

    .main-wrapper {
        padding: 90px 15px;
    }

    .form-card-3d {
        padding: 25px 18px;
        border-radius: 18px;
    }

    .lux-submit-btn {
        padding: 18px;
        font-size: 0.9rem;
        letter-spacing: 1.5px;
    }

    .input-box input,
    .input-box select,
    .input-box textarea {
        padding: 14px;
        font-size: 0.9rem;
    }

    .lux-back-btn {
        top: 20px;
        left: 20px;
    }

    .btn-text {
        display: none;
    }
}

/* 🔴 Mobile */
@media (max-width: 576px) {
    .page-header h1 {
        font-size: 1.8rem;
    }

    .page-header p {
        font-size: 0.8rem;
    }

    .form-card-3d {
        padding: 20px 15px;
    }

    .input-box label {
        font-size: 0.65rem;
    }

    .lux-submit-btn {
        padding: 16px;
    }
}

/* ⚫ Extra Small */
@media (max-width: 400px) {
    .page-header h1 {
        font-size: 1.5rem;
    }

    .lux-submit-btn {
        font-size: 0.8rem;
        letter-spacing: 1px;
    }

    .input-box input,
    .input-box select,
    .input-box textarea {
        padding: 12px;
    }
}

@media (max-width: 992px) {
    .main-wrapper {
        padding-top: 100px;
    }

    .form-card-3d {
        padding: 40px;
    }
}

/* --- MOBILE EXTRA --- */
@media (max-width: 768px) {
    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .main-wrapper {
        padding-top: 90px;
    }

    .form-card-3d {
        padding: 30px 20px;
        border-radius: 20px;
    }

    .lux-back-btn {
        top: 20px;
        left: 20px;
    }

    .btn-text {
        display: none;
    }

    .input-box {
        margin-bottom: 20px;
    }

    .input-box input,
    .input-box select,
    .input-box textarea {
        padding: 14px;
    }

    .lux-submit-btn {
        padding: 18px;
        letter-spacing: 1.5px;
        font-size: 0.9rem;
    }
}

/* --- EXTRA SMALL DEVICES --- */
@media (max-width: 480px) {
    .page-header h1 {
        margin-top: 20px;
    }

    .form-card-3d {
        margin-top: -10px;
    }
}
</style>
</head>
<body>

    <!-- BOKEH BACKGROUND -->
    <div class="bokeh-container">
        <div class="bokeh-item"></div>
        <div class="bokeh-item"></div>
        <div class="bokeh-item"></div>
        <div class="bokeh-item"></div>
    </div>

    <!-- BACK BUTTON -->
    <a href="#" onclick="history.back(); return false;" class="lux-back-btn">
        <div class="btn-circle">
            <i class="fas fa-arrow-left"></i>
        </div>
        <span class="btn-text"></span>
    </a>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">

        <!-- HEADER -->
        <header class="page-header">
            <h1>Reserve Your Story</h1>
            <p>Fill in the details to schedule your cinematic session</p>
            <div class="divider"></div>
        </header>

        <!-- FORM SECTION -->
        <section class="luxury-form-section">
            <div class="form-card-3d">

                <!-- FORM -->
                <form action="https://formsubmit.co/jeelsuthar1007@gmail.com" method="POST">

                    <!-- ROW 1 -->
                    <div class="form-row">
                        <div class="input-box">
                            <label>Full Name</label>
                            <input type="text" name="name" placeholder="Enter your name" required>
                        </div>
                        <div class="input-box">
                            <label>Email Address</label>
                            <input type="email" name="email" placeholder="example@mail.com" required>
                        </div>
                    </div>

                    <!-- ROW 2 -->
                    <div class="form-row">
                        <div class="input-box">
                            <label>Primary Number</label>
                            <input type="tel" name="mobile" placeholder="+91 00000 00000" required>
                        </div>
                        <div class="input-box">
                            <label>Alternate Number</label>
                            <input type="tel" name="altMobile" placeholder="+91 00000 00000">
                        </div>
                    </div>

                    <!-- ROW 3 -->
                    <div class="form-row">
                        <div class="input-box">
                            <label>Event Date</label>
                            <input type="date" name="date" required>
                        </div>
                        <div class="input-box">
                            <label>Preferred Time</label>
                            <input type="time" name="time" required>
                        </div>
                    </div>

                    <!-- SERVICE TYPE -->
                    <div class="input-box">
                        <label>Service Type</label>
                        <select name="service" required>
                            <option value="" disabled selected>Select an option</option>
                            <option value="Wedding Film">Cinematic Wedding Film</option>
                            <option value="Pre-Wedding">Pre-Wedding Story</option>
                            <option value="Baby Shower">Sweet Baby Shower</option>
                            <option value="Fashion Shooting">Fashion Shoot</option>
                            <option value="Commercial">Commercial</option>
                            <option value="Event">Event Coverage</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- OTHER SERVICE -->
                    <div class="input-box" id="other-service-box" style="display: none; margin-top: 15px;">
                        <label>Please Specify Your Requirement</label>
                        <input type="text" id="other-service-input" placeholder="Ex. Music Video, Documentary, etc.">
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="input-box">
                        <label>Event Description / Venue</label>
                        <textarea name="description" rows="4"></textarea>
                    </div>

                    <!-- HIDDEN FIELDS -->
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_subject" value="New Booking Request!">

                    <!-- SUBMIT BUTTON -->
                    <button type="submit" class="lux-submit-btn">
                        Confirm Booking
                    </button>

                </form>

            </div>
        </section>

    </div>



   <script>
    // --- CHECK OTHER OPTION ---
    function checkOtherOption() {
        const serviceSelect = document.getElementById('service');
        const otherBox = document.getElementById('other-service-box');
        const otherInput = document.getElementById('other-service-input');

        if (serviceSelect.value === 'Other') {
            otherBox.style.display = 'block';
            otherInput.setAttribute('required', 'true'); // જો 'Other' હોય તો લખવું ફરજિયાત
            otherBox.style.animation = 'fadeIn 0.5s ease'; // સ્મૂથ એનિમેશન
        } else {
            otherBox.style.display = 'none';
            otherInput.removeAttribute('required');
            otherInput.value = ''; // ક્લિયર કરી નાખવું
        }
    }


    // --- WHATSAPP CONFIG ---
    // REPLACE WITH YOUR ACTUAL PHONE NUMBER
    const yourPhoneNumber = "919876543210";


    // --- SEND DATA TO WHATSAPP ---
    function sendToWhatsApp(e) {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const mobile = document.getElementById('mobile').value;
        const altMobile = document.getElementById('altMobile').value || "N/A";
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;
        const service = document.getElementById('service').value;
        const desc = document.getElementById('description').value || "No description provided";


        // --- FORMAT WHATSAPP MESSAGE ---
        const text = `*✨ LUXURY BOOKING REQUEST ✨*%0a%0a` +
                     `*Client Name:* ${name}%0a` +
                     `*Email:* ${email}%0a` +
                     `*Mobile:* ${mobile}%0a` +
                     `*Alt Mobile:* ${altMobile}%0a%0a` +
                     `*SERVICE DETAILS*%0a` +
                     `*Category:* ${service}%0a` +
                     `*Date:* ${date}%0a` +
                     `*Time:* ${time}%0a%0a` +
                     `*Description/Venue:*%0a${desc}`;


        // --- OPEN WHATSAPP ---
        const url = `https://wa.me/${yourPhoneNumber}?text=${text}`;
        window.open(url, '_blank');
    }
    // --- DISABLE RIGHT CLICK ---
    document.addEventListener("contextmenu", e => e.preventDefault());


    // --- DISABLE DRAG ---
    document.addEventListener("dragstart", e => e.preventDefault());


    // --- DISABLE DEV TOOLS ---
    document.addEventListener("keydown", function (e) {
        if (e.key === "F12") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key === "I") e.preventDefault();
        if (e.ctrlKey && e.key === "U") e.preventDefault();
    });


    // --- BLUR WHEN INSPECT OPEN ---
    setInterval(() => {
        if (window.outerWidth - window.innerWidth > 100) {
            document.body.style.filter = "blur(15px)";
        } else {
            document.body.style.filter = "none";
        }
    }, 500);


    // --- SCREENSHOT TRICK ---
    document.addEventListener("keydown", function (e) {
        if (e.key === "PrintScreen") {
            document.body.style.background = "black";
            setTimeout(() => document.body.style.background = "", 100);
        }
    });
</script>
</body>
</html>
